<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>摄像头设置 · S1E</title>
<style>
/*
 * 配色对齐设备自身的 dark_modern 主题（深蓝黑底 + 蓝色强调），
 * 这样从 Web 控制台跳转过来时不会割裂。字体走系统栈，中文优先。
 */
:root {
  --bg:        #0b0f17;
  --surface:   #131a26;
  --surface-2: #1b2432;
  --line:      #26303f;
  --text:      #e8edf5;
  --text-dim:  #8b98ab;
  --accent:    #4a9eff;
  --accent-dim:#2d6fd4;
  --ok:        #3fbf7f;
  --warn:      #e0a54a;
  --err:       #e05a5a;
  --r:         12px;
  --sp:        20px;
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC",
        "Microsoft YaHei", system-ui, sans-serif;
  min-height: 100vh;
  padding: var(--sp);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 640px; margin: 0 auto; }

/* 页头 */
header { margin-bottom: 28px; }
h1 {
  font-size: 22px; font-weight: 600; margin: 0 0 6px;
  letter-spacing: .2px;
}
.sub { color: var(--text-dim); font-size: 13px; margin: 0; }
.sub code {
  background: var(--surface-2); padding: 1px 6px; border-radius: 4px;
  font-size: 12px; color: var(--text);
}

/* 卡片 */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 22px;
  margin-bottom: 16px;
}
.card h2 {
  font-size: 13px; font-weight: 600; margin: 0 0 18px;
  color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .8px;
}

/* 表单 */
.field { margin-bottom: 20px; }
.field:last-child { margin-bottom: 0; }
label {
  display: block; font-size: 13px; margin-bottom: 7px; color: var(--text-dim);
}
.hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

select, input[type=range] {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
}
select:focus, input:focus-visible {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(74,158,255,.15);
}
input[type=range] { padding: 0; height: 34px; accent-color: var(--accent); }

.row { display: flex; gap: 12px; }
.row > .field { flex: 1; margin-bottom: 20px; }

/* 按钮 */
button {
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: background .15s, transform .06s;
}
button:hover:not(:disabled) { background: var(--accent-dim); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.ghost {
  background: transparent; border: 1px solid var(--line); color: var(--text);
}
button.ghost:hover { background: var(--surface-2); }

/* 状态条 */
.status {
  padding: 11px 14px; border-radius: 8px; font-size: 13px;
  margin-bottom: 16px; display: none;
}
.status.show { display: block; }
.status.ok   { background: rgba(63,191,127,.12); color: var(--ok);   border:1px solid rgba(63,191,127,.3); }
.status.err  { background: rgba(224,90,90,.12);  color: var(--err);  border:1px solid rgba(224,90,90,.3); }
.status.load { background: var(--surface-2); color: var(--text-dim); border:1px solid var(--line); }

/* 预览 */
.preview {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; aspect-ratio: 1/1;
  display: flex; align-items: center; justify-content: center;
}
.preview img { width: 100%; height: 100%; object-fit: contain; display: none; }
.preview .ph { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px; }

footer { color: var(--text-dim); font-size: 12px; text-align: center; margin-top: 28px; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>摄像头设置</h1>
    <p class="sub">画面来自 Home Assistant。配置写入设备上的
      <code>/data/scripts/dev/cam_config.json</code>，保存后重启 <code>cam_view</code> 生效。</p>
  </header>

  <div id="status" class="status"></div>

  <div class="card">
    <h2>画面来源</h2>
    <div class="field">
      <label for="entity">摄像头实体</label>
      <select id="entity"><option value="">加载中…</option></select>
      <p class="hint">从 Home Assistant 的 camera 域实体中列出。</p>
    </div>
  </div>

  <div class="card">
    <h2>画面参数</h2>
    <div class="row">
      <div class="field">
        <label for="res">分辨率</label>
        <select id="res">
          <option value="480x360">480 × 360（最省内存）</option>
          <option value="640x480">640 × 480（推荐）</option>
          <option value="960x540">960 × 540</option>
          <option value="1280x720">1280 × 720（占用较高）</option>
        </select>
        <p class="hint">设备仅剩约 17MB 内存。解码缓冲 = 宽×高×3，
           1280×720 需要 2.8MB。</p>
      </div>
      <div class="field">
        <label for="fps">帧率：<span id="fpsv">3</span> fps</label>
        <input type="range" id="fps" min="1" max="10" value="3">
        <p class="hint">设备算力有限，建议不超过 5。</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>显示位置</h2>
    <div class="row">
      <div class="field">
        <label for="camera_page">摄像头在第几屏</label>
        <select id="camera_page"></select>
      </div>
      <div class="field">
        <label for="total_pages">总屏数</label>
        <input type="number" id="total_pages" min="1" max="16" value="3">
        <p class="hint">需与 Web 控制台布局里的屏数一致，否则翻页会错位。</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>预览</h2>
    <div class="preview">
      <div class="ph" id="ph">点击下方按钮抓一帧看看效果</div>
      <img id="img" alt="摄像头预览">
    </div>
    <div class="row" style="margin-top:16px; gap:10px;">
      <button class="ghost" id="btnPreview">抓一帧预览</button>
      <button class="ghost" id="btnReload">重新读取配置</button>
    </div>
  </div>

  <button id="btnSave" style="width:100%;">保存配置</button>

  <footer>
    自研工具 · 与作者的 Web 控制台互不干扰 ·
    <a href="/" target="_blank">返回控制台</a>
  </footer>

</div>

<script>
const CGI = "/cgi-bin/cam_cgi";
const $ = id => document.getElementById(id);
let loaded = false;

function status(msg, kind) {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status show ' + kind;
}
function hideStatus() { $('status').className = 'status'; }

/* 从 URL 里读整数 */
const q = k => parseInt(new URLSearchParams(location.search).get(k) || '', 10);

async function loadConfig() {
  status('正在读取配置…', 'load');
  try {
    const r = await fetch(CGI + '?action=get', { cache: 'no-store' });
    const c = await r.json();

    $('res').value = c.width + 'x' + c.height;
    $('fps').value = c.fps;
    $('fpsv').textContent = c.fps;
    $('total_pages').value = c.total_pages;
    buildPages(c.total_pages, c.camera_page);
    loaded = true;
    await loadEntities(c.entity);
    hideStatus();
  } catch (e) {
    status('读取配置失败：' + e.message, 'err');
  }
}

function buildPages(total, current) {
  const sel = $('camera_page');
  sel.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = '第 ' + (i + 1) + ' 屏';
    if (i === current) o.selected = true;
    sel.appendChild(o);
  }
}

async function loadEntities(current) {
  const sel = $('entity');
  sel.innerHTML = '<option value="">加载中…</option>';
  try {
    const r = await fetch(CGI + '?action=list', { cache: 'no-store' });
    const list = await r.json();
    if (!list.length) {
      sel.innerHTML = '<option value="">（未找到摄像头实体）</option>';
      return;
    }
    sel.innerHTML = '';
    for (const e of list) {
      const o = document.createElement('option');
      o.value = e.entity_id;
      o.textContent = e.name + '  ·  ' + e.entity_id;
      if (e.entity_id === current) o.selected = true;
      sel.appendChild(o);
    }
  } catch (e) {
    sel.innerHTML = '<option value="">加载失败</option>';
    status('读取实体列表失败：' + e.message, 'err');
  }
}

$('fps').addEventListener('input', e => { $('fpsv').textContent = e.target.value; });
$('total_pages').addEventListener('change', e => {
  const total = Math.max(1, Math.min(16, parseInt(e.target.value) || 3));
  buildPages(total, parseInt($('camera_page').value) || 0);
});

$('btnPreview').addEventListener('click', async () => {
  status('正在抓帧…', 'load');
  // 每次带随机参数绕开缓存
  const url = CGI + '?action=snapshot&_=' + Date.now();
  try {
    const img = $('img');
    img.onload = () => {
      $('img').style.display = 'block';
      $('ph').style.display = 'none';
      status('预览成功。这就是屏幕上会显示的画面。', 'ok');
    };
    img.onerror = () => status('抓帧失败，检查实体与 HA 连接', 'err');
    img.src = url;
  } catch (e) {
    status('抓帧失败：' + e.message, 'err');
  }
});

$('btnReload').addEventListener('click', loadConfig);

$('btnSave').addEventListener('click', async () => {
  if (!loaded) { status('请先等待配置加载完成', 'err'); return; }

  const entity = $('entity').value;
  if (!entity) { status('请选择一个摄像头实体', 'err'); return; }

  const [w, h] = $('res').value.split('x').map(Number);
  const body = {
    entity: entity,
    width: w, height: h,
    fps: parseInt($('fps').value),
    camera_page: parseInt($('camera_page').value),
    total_pages: Math.max(1, Math.min(16, parseInt($('total_pages').value) || 3))
  };

  $('btnSave').disabled = true;
  status('保存中…', 'load');
  try {
    const r = await fetch(CGI + '?action=save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if (j.status === 'ok') {
      status('已保存。重启 cam_view 后生效：killall cam_view && /data/scripts/dev/cam_view &', 'ok');
    } else {
      status('保存失败：' + (j.message || '未知错误'), 'err');
    }
  } catch (e) {
    status('保存失败：' + e.message, 'err');
  } finally {
    $('btnSave').disabled = false;
  }
});

loadConfig();
</script>
</body>
</html>
